name: Build zones rpk

on:
  push:
    branches: [main, master]
    paths: ['zones/**', '.github/workflows/build-zones.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zones
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установка зависимостей
        run: npm install

      - name: Сборка .rpk
        run: |
          set +e
          npx aiot build 2>&1 | tee build.log
          echo "exit-code: ${PIPESTATUS[0]}" | tee -a build.log
          exit 0

      - name: Лог сборки в ветку ci-log
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-log-tmp
          git rm -rf -q . || true
          mkdir -p ci
          cp zones/build.log ci/zones-build.log
          git add ci/zones-build.log
          git commit -q -m "zones build log"
          git push -f origin HEAD:refs/heads/ci-log

      - name: Найти .rpk
        run: |
          mkdir -p out
          find . -name '*.rpk' -not -path './node_modules/*' -exec cp {} out/ \;
          if [ -z "$(ls out/*.rpk 2>/dev/null)" ]; then
            echo "!!! .rpk не найден"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: zones-rpk
          path: zones/out/*.rpk
