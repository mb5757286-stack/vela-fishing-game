name: Build rpk

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Установка зависимостей
        run: npm install

      - name: Сборка .rpk
        run: npx aiot build

      - name: Найти .rpk
        run: |
          ls -la dist
          test -n "$(ls dist/*.rpk 2>/dev/null)"

      - uses: actions/upload-artifact@v4
        with:
          name: fishing-rpk
          path: dist/*.rpk

      - name: Релиз по тегу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.rpk
