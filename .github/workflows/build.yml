name: Build rpk

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установка зависимостей
        run: npm install

      - name: Сборка .rpk
        run: |
          set +e
          node -v
          npx aiot build 2>&1 | tee build.log
          echo "exit-code: ${PIPESTATUS[0]}" | tee -a build.log
          exit 0

      - name: Найти .rpk
        run: |
          echo "--- корень проекта ---"
          ls -la
          echo "--- все .rpk в проекте ---"
          find . -name '*.rpk' -not -path './node_modules/*' || true
          mkdir -p out
          find . -name '*.rpk' -not -path './node_modules/*' -not -path './out/*' -exec cp {} out/ \;
          ls -la out
          if [ -z "$(ls out/*.rpk 2>/dev/null)" ]; then
            echo "!!! .rpk не найден, справка сборщика:"
            npx aiot build -h || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: fishing-rpk
          path: out/*.rpk

      - name: Релиз по тегу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.rpk

