name: Build ducks rpk

on:
  push:
    branches: [main, master]
    paths: ['ducks/**', '.github/workflows/build-ducks.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ducks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установка зависимостей
        run: npm install

      - name: Сборка .rpk
        run: npx aiot build

      - name: Найти .rpk
        run: |
          mkdir -p out
          find . -name '*.rpk' -not -path './node_modules/*' -exec cp {} out/ \;
          if [ -z "$(ls out/*.rpk 2>/dev/null)" ]; then
            echo "!!! .rpk не найден"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ducks-rpk
          path: ducks/out/*.rpk
